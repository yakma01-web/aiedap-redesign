<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 융합수업의 평가와 Re-design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#f6f6f6}
a{color:#1E4CFD}a:hover{color:#00459A}
*{box-sizing:border-box}
button,textarea,input{font-family:inherit}
button:disabled{opacity:.55;cursor:not-allowed}
.bp:active{background:#00459A !important;border-color:#00459A !important}
.hs{padding:10px 0;cursor:pointer;font-size:16px;line-height:24px}
:focus-visible{outline:3px solid #1E4CFD;outline-offset:2px}
.sl{display:block;width:100%;height:auto;aspect-ratio:16/9;border:1px solid #d6e4ff;border-radius:20px}
.sm{padding:12px 0;cursor:pointer;color:#1E4CFD;font-size:14px;line-height:20px;text-decoration:underline}
details .sl{margin-top:8px}
.sp{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;border:2px dashed #80B5F7;border-radius:20px;background:#ffffff;color:#1E4CFD;cursor:pointer;font-size:16px;line-height:24px;text-align:center;padding:12px}
details[open] .sp{aspect-ratio:auto;border:0;background:transparent;justify-content:flex-start;padding:4px 0;font-size:14px;text-decoration:underline}
.vth{view-transition-name:hello}
.vtt{view-transition-name:ttl}
.vtp{view-transition-name:prevb}
.vtn{view-transition-name:nextb}
.vst{view-transition-name:stage}
.vtit{view-transition-name:ititle}
.vpor{view-transition-name:portrait}
.vsl{view-transition-name:slide}
.vpg{view-transition-name:pgno}
.vsec{view-transition-name:secpill}
::view-transition-group(*){animation-duration:.6s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
::view-transition-old(*),::view-transition-new(*){animation-duration:.6s}
</style>
<link rel="stylesheet" href="assets/race.css">
<style>
html,body{height:100%;overflow:hidden}
#aiedapRoot{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}
.rot{display:none}
@media (orientation:portrait) and (max-width:820px){.rot{display:block;position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 14px/20px 'Noto Sans KR',system-ui,sans-serif;color:#00459A}}
</style>
</head>
<body>
<div id="aiedapRoot"></div>
<div class="rot">화면을 가로로 돌리면 크게 볼 수 있습니다.</div>
<script defer src="assets/race-assets.js"></script>
<script defer src="assets/race-code.js"></script>
<script defer src="app.js"></script>
</body>
</html>
